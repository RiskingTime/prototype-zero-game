let units=[],order=[],turn=0,round=1,gameOver=false,hoverPath=[],pendingTarget=null,inspected=null,hoverKey=null,persistentHint='',initExpanded=false;
const die=n=>1+Math.floor(Math.random()*n),dist=(a,b)=>Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y)),alive=t=>units.filter(u=>u.team===t&&u.hp>0),cur=()=>order[turn],coord=(x,y)=>String.fromCharCode(65+x)+(y+1),key=(x,y)=>x+','+y;
function setHint(s,persist=false){hint.textContent=s;if(persist)persistentHint=s}
function clearPersistent(){persistentHint=''}
function flash(s){toast.textContent=s;toast.classList.add('show')}function clearFlash(){toast.classList.remove('show');toast.textContent=''}
function addLog(summary,details=[]){const box=document.createElement('div');box.className='logitem';box.innerHTML='<div class="logsummary"><span class="arrow">'+(details.length?'▸':'·')+'</span><span></span></div><div class="details"></div>';box.querySelector('.logsummary span:last-child').textContent=summary;if(details.length){box.querySelector('.details').innerHTML=details.map(x=>'<div>'+x+'</div>').join('');box.querySelector('.logsummary').onclick=()=>{box.classList.toggle('open');box.querySelector('.arrow').textContent=box.classList.contains('open')?'▾':'▸'}}log.prepend(box);log.scrollTop=0}
function damageRoll(u){let rolls=[];for(let i=0;i<u.dmg[0];i++)rolls.push(die(u.dmg[1]));return{rolls,total:rolls.reduce((a,b)=>a+b,0)}}

function attackReason(a,t){if(a.ap<a.cost)return 'Cannot attack: needs '+a.cost+' AP, but only '+a.ap+' AP remains.';let d=dist(a,t);if(d>a.range)return 'Cannot attack: target is '+d+' tiles away and '+a.name+' has range '+a.range+'. Move closer first.';return null}
function resolveAttack(a,t){let why=attackReason(a,t);if(why){setHint(why,true);addLog(a.name+' cannot attack '+t.name+'.',[why]);flash(why);return}clearPersistent();clearFlash();a.ap-=a.cost;let before=t.hp,r=die(20),b=hitBreakdown(a,t),total=r+a.atk+b.situational,hit=r===20||(r!==1&&total>=b.def),details=['Attacker: '+a.name+' ('+a.className+') - '+(a.weapon||'Unarmed'),'Target: '+t.name+' ('+t.className+')','Attack roll: d20 '+r+' + attack '+a.atk+(b.situational?' + situational '+b.situational:'')+' = '+total,b.defenseName+' target: '+b.def,'AP cost: '+a.cost+' - remaining AP: '+a.ap+'/3'];if(hit){let dr=damageRoll(a),d=dr.total;if(r===20)d*=2;t.hp=Math.max(0,t.hp-d);details.push('Damage dice: '+dr.rolls.join(' + ')+(r===20?' x 2 critical':'')+' = '+d,'HP: '+before+' -> '+t.hp+' / '+t.max);let summary=a.name+' '+(r===20?'CRITS':'hits')+' '+t.name+' for '+d+' damage ('+before+' -> '+t.hp+' HP).'+(t.hp===0?' '+t.name+' is defeated.':'');addLog(summary,details);flash((r===20?'CRIT':'HIT')+' - '+d+' damage'+(t.hp===0?' - '+t.name+' defeated':''))}else{details.push('Result: miss. Target HP remains '+t.hp+'/'+t.max);addLog(a.name+' misses '+t.name+'.',details);flash('MISS')}pendingTarget=null;render();if(checkEnd())return;if(a.team==='hero'&&a.ap===0)setTimeout(()=>{clearFlash();next()},350)}
function checkEnd(){if(!alive('enemy').length){gameOver=true;status.textContent='Victory - enemy squad defeated';render();return true}if(!alive('hero').length){gameOver=true;status.textContent='Defeat - the party has fallen';render();return true}return false}
function rollInitiative(){order=units.filter(u=>u.hp>0);let details=[];order.forEach(u=>{u.initDie=die(10);u.init=u.initDie+u.int;u.ap=3});order.sort((a,b)=>b.init-a.init);order.forEach((u,i)=>details.push((i+1)+'. '+u.name+': '+u.initDie+' + INT '+u.int+' = '+u.init));turn=0;addLog('Round '+round+' - Initiative '+(round===1?'rolled':'re-rolled'),details);inspected=cur();clearPersistent();render();advanceAI()}

function unitAt(x,y,except){return units.find(u=>u.hp>0&&u!==except&&u.x===x&&u.y===y)||null}function occupied(x,y,except){return !!unitAt(x,y,except)}function blocksPassage(a,x,y){let u=unitAt(x,y,a);return !!(u&&u.team!==a.team)}function endpointBlocked(a,x,y){return !!unitAt(x,y,a)}
function directPath(a,tx,ty,maxSteps){let x=a.x,y=a.y,out=[];while((x!==tx||y!==ty)&&out.length<maxSteps){let sx=Math.sign(tx-x),sy=Math.sign(ty-y),choices=[];if(sx&&sy)choices.push([sx,sy]);if(Math.abs(tx-x)>=Math.abs(ty-y)&&sx)choices.push([sx,0]);if(sy)choices.push([0,sy]);if(sx)choices.push([sx,0]);let moved=false;for(const [dx,dy] of choices){let nx=x+dx,ny=y+dy;if(nx>=0&&nx<15&&ny>=0&&ny<15&&!blocksPassage(a,nx,ny)){x=nx;y=ny;out.push([x,y]);moved=true;break}}if(!moved)return null}return x===tx&&y===ty?out:null}
function fallbackPath(a,tx,ty,maxSteps){let q=[[a.x,a.y,[]]],seen=new Set([key(a.x,a.y)]);while(q.length){let [x,y,p]=q.shift();if(p.length>=maxSteps)continue;let dirs=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy)dirs.push([dx,dy]);dirs.sort((d1,d2)=>{const score=d=>Math.max(Math.abs(tx-(x+d[0])),Math.abs(ty-(y+d[1])));return score(d1)-score(d2)});for(const [dx,dy] of dirs){let nx=x+dx,ny=y+dy,k=key(nx,ny);if(nx<0||nx>=15||ny<0||ny>=15||seen.has(k)||blocksPassage(a,nx,ny))continue;let np=p.concat([[nx,ny]]);if(nx===tx&&ny===ty)return np;seen.add(k);q.push([nx,ny,np])}}return null}
function pathTo(a,tx,ty,maxSteps){if(tx<0||tx>=15||ty<0||ty>=15||endpointBlocked(a,tx,ty))return null;if(tx===a.x&&ty===a.y)return[];return directPath(a,tx,ty,maxSteps)||fallbackPath(a,tx,ty,maxSteps)}
function movementPath(a,x,y){return pathTo(a,x,y,a.ap*4)}function movementCost(p){return p&&p.length?Math.ceil(p.length/4):0}
function moveFailureReason(a,x,y){let occ=units.find(u=>u.hp>0&&u!==a&&u.x===x&&u.y===y);if(occ)return 'Cannot move to '+coord(x,y)+': occupied by '+occ.name+'.';if(a.ap<=0)return 'Cannot move: '+a.name+' has 0 AP remaining.';let theoretical=Math.max(Math.abs(x-a.x),Math.abs(y-a.y)),cost=Math.ceil(theoretical/4);if(cost>a.ap)return 'Cannot move to '+coord(x,y)+': requires at least '+cost+' AP, but only '+a.ap+' AP remains.';return 'Cannot move to '+coord(x,y)+': no legal path is available with '+a.ap+' AP remaining.'}
function stepToward(a,t){let candidates=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;let tx=t.x+dx,ty=t.y+dy;if(tx<0||tx>=15||ty<0||ty>=15||endpointBlocked(a,tx,ty))continue;let p=pathTo(a,tx,ty,4);if(p&&p.length)candidates.push(p)}candidates.sort((p,q)=>p.length-q.length);let p=candidates[0];if(p&&p.length){let step=p[Math.min(3,p.length-1)];a.x=step[0];a.y=step[1];return true}return false}
function enemyTurn(){let a=cur();if(!a||a.team!=='enemy'||a.hp<=0){next();return}let safety=8;while(a.ap>0&&safety--&&!gameOver){let t=alive('hero').sort((p,q)=>dist(a,p)-dist(a,q))[0];if(!t)break;if(dist(a,t)<=a.range&&a.ap>=a.cost){resolveAttack(a,t);if(gameOver)return}else if(a.ap>=1){let from=coord(a.x,a.y),moved=stepToward(a,t);if(!moved)break;a.ap--;addLog(a.name+' moves '+from+' -> '+coord(a.x,a.y)+'.',['Cost: 1 AP','Remaining AP: '+a.ap+'/3'])}else break}setTimeout(next,220)}
function advanceAI(){let a=cur();if(a&&a.team==='enemy'&&!gameOver){status.textContent='Round '+round+' - '+a.name+' acting';setTimeout(enemyTurn,260)}}
function chooseAttack(t){let a=cur(),b=hitBreakdown(a,t),dp=damageProfile(a),d=dist(a,t);pendingTarget=t;modaltext.innerHTML='<div class="chance">'+b.chance+'% HIT</div><div class="attackgrid"><div class="attackcard"><b>Attacker - '+a.name+'</b>'+a.className+'<br>HP '+a.hp+'/'+a.max+' · AP '+a.ap+'/3<br>'+(a.weapon||'Unarmed')+' · '+(a.type==='magic'?'Magic':'Physical')+'<br>Attack +'+a.atk+' · Range '+a.range+'<br><b style="margin-top:6px">Damage '+a.dmg[0]+'d'+a.dmg[1]+'</b>'+dp.min+'-'+dp.max+' damage · avg '+dp.avg+'<br>Critical: '+dp.critMin+'-'+dp.critMax+' damage</div><div class="attackcard"><b>Target - '+t.name+'</b>'+t.className+' · '+coord(t.x,t.y)+'<br>HP '+t.hp+'/'+t.max+'<br>AC '+t.ac+' · MR '+t.mr+'<br>Relevant defense: '+b.defenseName+' '+b.def+'<br>Distance: '+d+' / '+a.range+' tiles<br>Visible status: none</div></div><div class="calc"><b>Hit chance calculation</b><br>d20 + attack bonus '+a.atk+' vs '+b.defenseName+' '+b.def+'<br>Base roll needed: '+Math.max(1,b.rawNeed)+'+'+(b.rawNeed<=1?' (natural 1 still misses)':'')+'<br>Situational modifiers: '+(b.situational>=0?'+':'')+b.situational+'<br>Effective roll needed: '+b.need+'+<br><b>Final hit chance: '+b.chance+'%</b><br><span class="mutedline">AP cost: '+a.cost+' · AP after attack: '+(a.ap-a.cost)+'/3</span></div>';modal.classList.add('show')}
function inspect(u){inspected=u;renderSidePanel()}
function commitMove(a,x,y,p){clearPersistent();clearFlash();let cost=movementCost(p),from=coord(a.x,a.y);a.x=x;a.y=y;a.ap-=cost;addLog(a.name+' moves '+from+' -> '+coord(x,y)+'.',['Path: '+[from,...p.map(z=>coord(z[0],z[1]))].join(' -> '),'Distance: '+p.length+' tile'+(p.length===1?'':'s'),'Cost: '+cost+' AP','Remaining AP: '+a.ap+'/3']);hoverPath=[];hoverKey=null;inspected=a;flash('MOVE - '+cost+' AP - '+a.ap+' AP left');render();if(a.ap===0)setTimeout(()=>{clearFlash();next()},350)}
function cellClick(x,y,u){clearFlash();clearPersistent();let a=cur();if(gameOver||!a)return;if(a.team!=='hero'){setHint('Enemy turn - wait for the AI to finish.',true);return}if(u){inspect(u);if(u===a){setHint(a.name+' selected. Click the character panel for full details.',true);return}if(u.team==='enemy'){let why=attackReason(a,u);if(!why){clearPersistent();chooseAttack(u)}else{let msg=why+' Hit chance if the attack were legal: '+hitChance(a,u)+'%.';setHint(msg,true);addLog(a.name+' cannot attack '+u.name+'.',[why,'Current AP: '+a.ap+'/3','Target distance: '+dist(a,u),'Attack range: '+a.range]);flash(why)}return}setHint(u.name+' is a friendly unit. Click the character panel for details.',true);return}let p=movementPath(a,x,y);if(p&&p.length&&movementCost(p)<=a.ap){commitMove(a,x,y,p);return}let why=moveFailureReason(a,x,y);setHint(why,true);addLog(a.name+' cannot move to '+coord(x,y)+'.',[why]);flash(why)}
function clearPathClasses(){grid.querySelectorAll('.cell.path').forEach(c=>c.classList.remove('path'))}function applyPathPreview(p){clearPathClasses();if(!p)return;p.forEach(z=>{let c=grid.querySelector('.cell[data-x="'+z[0]+'"][data-y="'+z[1]+'"]');if(c)c.classList.add('path')})}
function previewMove(a,x,y){let p=movementPath(a,x,y);hoverPath=p||[];hoverKey=key(x,y);applyPathPreview(p);if(persistentHint)return;if(p&&p.length){let cost=movementCost(p);setHint(coord(x,y)+' - '+p.length+' tile'+(p.length===1?'':'s')+' - '+cost+' AP. Click to move. After the move, '+a.name+' will have '+(a.ap-cost)+' AP remaining.')}else if(x===a.x&&y===a.y)setHint(a.name+' is standing on '+coord(x,y)+'. AP remaining: '+a.ap+'/3.');else setHint(moveFailureReason(a,x,y))}
function renderGrid(){grid.innerHTML='';let corner=document.createElement('div');corner.className='axis';grid.appendChild(corner);for(let x=0;x<15;x++){let d=document.createElement('div');d.className='axis';d.textContent=String.fromCharCode(65+x);grid.appendChild(d)}for(let y=0;y<15;y++){let r=document.createElement('div');r.className='axis';r.textContent=y+1;grid.appendChild(r);for(let x=0;x<15;x++){let c=document.createElement('button');c.className='cell';c.type='button';c.dataset.x=x;c.dataset.y=y;let u=units.find(q=>q.hp>0&&q.x===x&&q.y===y),a=cur();if(u){c.textContent=u.label||u.id;c.classList.add(u.team);c.title=coord(x,y)+' - '+u.name+' - '+u.hp+'/'+u.max+' HP';if(a===u)c.classList.add('selected');if(inspected===u&&a!==u)c.classList.add('target')}else c.title=coord(x,y);if(a&&a.team==='hero'&&!u&&a.ap>0){let p=movementPath(a,x,y),cost=movementCost(p);if(p&&p.length&&cost<=a.ap)c.classList.add('legal')}if(a&&a.team==='hero'&&u&&u.team==='enemy'){if(!attackReason(a,u))c.classList.add('target');else c.classList.add('invalid')}c.onclick=()=>cellClick(x,y,u);c.onmouseenter=()=>{if(!a||a.team!=='hero')return;if(!u)previewMove(a,x,y);else if(u.team==='enemy'){clearPathClasses();if(persistentHint)return;let why=attackReason(a,u),chance=hitChance(a,u),d=dist(a,u);setHint(why?(u.name+' at '+coord(x,y)+' - '+why+' Hit chance if legal: '+chance+'%.'):(u.name+' at '+coord(x,y)+' - IN RANGE - '+chance+'% hit chance - '+a.cost+' AP - distance '+d+'/'+a.range+'. Click to attack.'))}else{if(persistentHint)return;setHint(u.name+' - friendly unit - click to inspect.')}};grid.appendChild(c)}}if(hoverPath.length)applyPathPreview(hoverPath)}
function renderInitiative(){initCompact.textContent='';initBox.innerHTML='';order.forEach((u,i)=>{let d=document.createElement('div');d.className='turn'+(i===turn?' current':'');d.textContent=(i===turn?'▶ ':'')+u.name+' - '+u.init+(u.hp<=0?' - defeated':'');initBox.appendChild(d)});initBox.classList.toggle('show',initExpanded);initArrow.textContent=initExpanded?'▾':'▸'}
function renderSidePanel(){let a=cur();if(a&&!gameOver){status.textContent='Round '+round+' - '+a.name+"'s turn";let shown=inspected&&inspected.hp>0?inspected:a;unitBox.innerHTML='<b>'+shown.name+'</b>'+(shown===a?' - ACTIVE':' - INSPECTING')+'<br>Class: '+shown.className+'<br>HP '+shown.hp+'/'+shown.max+(shown===a?' - <b>AP '+shown.ap+'/3</b>':'')+'<br>AC '+shown.ac+' - MR '+shown.mr+'<br>Attack +'+shown.atk+' - '+(shown.type==='magic'?'Magic':'Physical')+' - Range '+shown.range+' - '+shown.cost+' AP<br><span class="muted">Click this panel for full character details.</span>';if(persistentHint)setHint(persistentHint);else if(a.team==='hero'&&!hoverKey)setHint('Your turn: hover an empty tile to preview movement and AP cost. Hover an enemy to see range, hit chance and attack cost. Click a legal destination to move or a legal enemy to attack.');else if(a.team!=='hero')setHint('Enemy AI is acting.')}renderInitiative();let heroTurn=a&&a.team==='hero'&&!gameOver;end.disabled=!heroTurn}
function render(){renderGrid();renderSidePanel()}
function slot(label,value){return '<div class="slot"><b>'+label+'</b>'+(value||'Empty')+'</div>'}
function openSheet(){let u=inspected&&inspected.hp>0?inspected:cur();if(!u)return;sheetName.textContent=u.name;sheetSub.textContent=(u.team==='hero'?'Party':'Enemy')+' unit - '+u.className+' - '+coord(u.x,u.y);portraitClass.textContent=u.className;portraitTeam.textContent=u.team==='hero'?'Party member':'Enemy combatant';portraitFace.innerHTML=u.team==='hero'?'&#9786;':'&#9785;';slotsL.innerHTML=slot('Main Hand',u.weapon)+slot('Off Hand',u.shield)+slot('Armor',u.armor)+slot('Amulet',u.amulet);slotsR.innerHTML=slot('Helm',u.helm)+slot('Gloves',u.gloves)+slot('Boots',u.boots)+slot('Ring',u.ring);let stats=[['STR',u.str],['DEX',u.dex],['CON',u.con],['INT',u.int],['WIS',u.wis],['HP',u.hp+'/'+u.max],['AC',u.ac],['MR',u.mr],['Attack','+'+u.atk],['Init',u.init||'-']];sheetStats.innerHTML=stats.map(s=>'<div class="statbox"><b>'+s[1]+'</b>'+s[0]+'</div>').join('');sheetAttack.innerHTML='<h2 style="margin-top:0">Primary attack</h2><div class="stat"><b>'+(u.type==='magic'?'Magic attack':'Physical attack')+'</b><br>Weapon: '+(u.weapon||'Unarmed')+'<br>Range: '+u.range+' tiles<br>AP cost: '+u.cost+'<br>Damage: '+u.dmg[0]+'d'+u.dmg[1]+'<br>Attack bonus: +'+u.atk+'</div>';sheet.classList.add('show')}
unitPanel.onclick=()=>{clearFlash();openSheet()};closeSheet.onclick=e=>{e.preventDefault();e.stopPropagation();clearFlash();sheet.classList.remove('show');render()};initToggle.onclick=()=>{clearFlash();initExpanded=!initExpanded;renderInitiative()};end.onclick=()=>{clearFlash();if(cur()?.team==='hero'){clearPersistent();inspected=null;next()}};restart.onclick=()=>{clearFlash();start()};modalcancel.onclick=()=>{clearFlash();modal.classList.remove('show');pendingTarget=null};modalconfirm.onclick=()=>{clearFlash();let a=cur(),t=pendingTarget;modal.classList.remove('show');if(a&&t)resolveAttack(a,t)};
function start(){units=base.map(u=>({...u,ap:3}));order=[];turn=0;round=1;gameOver=false;hoverPath=[];hoverKey=null;pendingTarget=null;inspected=null;persistentHint='';initExpanded=false;log.innerHTML='';sheet.classList.remove('show');clearFlash();rollInitiative()}start();
})();</script></body></html>
