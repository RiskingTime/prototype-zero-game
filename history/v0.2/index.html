<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prototype Zero — v0.2</title>
<style>
:root{--bg:#17191d;--panel:#22262c;--cell:#30363d;--line:#59616b;--text:#f2f4f7;--muted:#aeb6c2;--hero:#3978b8;--enemy:#a84b4b;--sel:#d6b85a;--good:#4c956c;--path:#c9a84c;--legal:#477257}
*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{height:54px;padding:8px 14px;border-bottom:1px solid #333;background:#121418;display:flex;align-items:center;justify-content:space-between}h1{font-size:17px;margin:0}.sub{color:var(--muted);font-size:11px}
main{height:calc(100vh - 54px);display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:10px;padding:10px;max-width:1180px;margin:auto}.boardwrap{min-height:0;display:flex;align-items:center;justify-content:center}.coordgrid{height:min(calc(100vh - 78px),760px);aspect-ratio:1;display:grid;grid-template-columns:22px repeat(15,1fr);grid-template-rows:22px repeat(15,1fr);gap:1px}.axis{font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:center}.cell{border:1px solid #454b54;background:var(--cell);color:white;border-radius:2px;font-weight:800;cursor:pointer;min-width:0;min-height:0;padding:0;position:relative}.cell.hero{background:var(--hero)}.cell.enemy{background:var(--enemy)}.cell.selected{outline:3px solid var(--sel);z-index:3}.cell.legal{box-shadow:inset 0 0 0 2px var(--legal)}.cell.path{box-shadow:inset 0 0 0 3px var(--path)}.cell.target{outline:3px solid #eee;z-index:2}.cell.invalid{opacity:.55}.cell:hover{filter:brightness(1.16)}
aside{min-height:0;display:grid;grid-template-rows:auto auto auto minmax(120px,1fr);gap:7px}.panel{background:var(--panel);border:1px solid #353a42;border-radius:8px;padding:9px;min-height:0}.panel h2{font-size:13px;margin:0 0 6px}.stat{font-size:12px;line-height:1.4}.muted{color:var(--muted)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:5px}button.action{padding:7px;background:#343a43;color:white;border:1px solid #555d68;border-radius:6px;cursor:pointer;font-size:12px}button.action:hover{background:#414954}button.action:disabled{opacity:.35;cursor:not-allowed}.wide{grid-column:1/-1}#hint{margin-top:6px;min-height:34px;padding:6px;border-radius:5px;background:#1b1e23}.turn{font-size:11px;padding:2px 0}.current{font-weight:800;color:#f0d36a}#initiative{max-height:110px;overflow:auto}.logpanel{display:flex;flex-direction:column}.logpanel h2{flex:none}#log{overflow:auto;font-size:11px;line-height:1.35;min-height:0}.logitem{border-bottom:1px solid #333;padding:4px 0}.logsummary{cursor:pointer;display:flex;gap:5px}.arrow{width:12px;color:var(--muted)}.details{display:none;color:var(--muted);padding:3px 0 2px 17px}.logitem.open .details{display:block}.floating{position:absolute;pointer-events:none;background:#111d;color:#fff;border:1px solid #777;border-radius:5px;padding:4px 6px;font-size:11px;transform:translate(-50%,-115%);white-space:nowrap;z-index:5}.modalback{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:20}.modalback.show{display:flex}.modal{width:min(390px,90vw);background:#242930;border:1px solid #59616b;border-radius:10px;padding:16px}.modal h3{margin:0 0 8px;font-size:16px}.modalbuttons{display:flex;gap:8px;margin-top:12px}.modalbuttons button{flex:1;padding:9px;border-radius:6px;border:1px solid #666;background:#343a43;color:#fff;cursor:pointer}.modalbuttons .confirm{background:#315f46}.toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);padding:8px 12px;background:#111e;border:1px solid #777;border-radius:7px;font-weight:800;z-index:30;opacity:0;transition:.15s}.toast.show{opacity:1}
@media(max-width:850px){main{grid-template-columns:minmax(0,1fr) 270px}.coordgrid{height:min(calc(100vh - 78px),680px)}}
</style></head><body>
<header><div><h1>Prototype Zero — Encounter 001</h1><div class="sub">Playable vertical slice · v0.2 · guided combat test</div></div><div class="sub">A–O × 1–15</div></header>
<main><div class="boardwrap"><div id="grid" class="coordgrid"></div></div><aside>
<div class="panel"><h2 id="status">Encounter</h2><div id="unit" class="stat muted">Rolling initiative…</div></div>
<div class="panel"><h2>Actions</h2><div class="actions"><button class="action" id="move">Move · 1 AP</button><button class="action" id="attack">Attack</button><button class="action" id="end">End Turn</button><button class="action" id="cancel">Cancel</button><button class="action wide" id="restart">Restart Encounter</button></div><div id="hint" class="stat muted"></div></div>
<div class="panel"><h2>Initiative</h2><div id="initiative"></div></div>
<div class="panel logpanel"><h2>Combat Log</h2><div id="log"></div></div>
</aside></main>
<div id="modalback" class="modalback"><div class="modal"><h3>Confirm Attack</h3><div id="modaltext" class="stat"></div><div class="modalbuttons"><button id="modalcancel">Cancel</button><button id="modalconfirm" class="confirm">Confirm Attack</button></div></div></div><div id="toast" class="toast"></div>
<script>(()=>{
const grid=document.querySelector('#grid'),status=document.querySelector('#status'),unitBox=document.querySelector('#unit'),hint=document.querySelector('#hint'),log=document.querySelector('#log'),initBox=document.querySelector('#initiative'),modal=document.querySelector('#modalback'),modaltext=document.querySelector('#modaltext'),toast=document.querySelector('#toast');
const base=[
{id:'K',name:'Knight',team:'hero',x:2,y:6,hp:24,max:24,ac:15.5,mr:7.5,int:3,atk:11,dmg:[1,6],cost:1,type:'physical',range:1},
{id:'A',name:'Archer',team:'hero',x:2,y:7,hp:18,max:18,ac:12.5,mr:9.5,int:6,atk:11,dmg:[2,6],cost:2,type:'physical',range:9},
{id:'W',name:'Wizard',team:'hero',x:1,y:6,hp:16,max:16,ac:8.5,mr:13,int:7,atk:12,dmg:[2,6],cost:2,type:'magic',range:7},
{id:'C',name:'Cleric',team:'hero',x:1,y:7,hp:22,max:22,ac:10.5,mr:11,int:9,atk:11,dmg:[1,8],cost:2,type:'magic',range:6},
{id:'H1',label:'H',name:'Hammer Brute',team:'enemy',x:12,y:5,hp:24,max:24,ac:13,mr:8,int:3,atk:8,dmg:[3,8],cost:3,type:'physical',range:1},
{id:'H2',label:'H',name:'Sword Brute',team:'enemy',x:12,y:9,hp:22,max:22,ac:13,mr:8,int:4,atk:8,dmg:[2,8],cost:2,type:'physical',range:1},
{id:'L',name:'Light Melee',team:'enemy',x:11,y:7,hp:16,max:16,ac:12,mr:9,int:6,atk:7,dmg:[1,6],cost:1,type:'physical',range:1},
{id:'B',name:'Bowman',team:'enemy',x:13,y:4,hp:16,max:16,ac:11,mr:9,int:5,atk:8,dmg:[2,6],cost:2,type:'physical',range:9},
{id:'X',name:'Crossbowman',team:'enemy',x:13,y:10,hp:17,max:17,ac:12,mr:9,int:4,atk:8,dmg:[3,8],cost:3,type:'physical',range:9},
{id:'M',name:'Enemy Mage',team:'enemy',x:13,y:7,hp:15,max:15,ac:9,mr:12,int:8,atk:10,dmg:[3,6],cost:2,type:'magic',range:7}];
let units=[],order=[],turn=0,round=1,mode=null,gameOver=false,hoverPath=[],pendingTarget=null;
const die=n=>1+Math.floor(Math.random()*n),dist=(a,b)=>Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y)),alive=t=>units.filter(u=>u.team===t&&u.hp>0),cur=()=>order[turn],coord=(x,y)=>String.fromCharCode(65+x)+(y+1);
function addLog(summary,details=[]){const box=document.createElement('div');box.className='logitem';box.innerHTML=`<div class="logsummary"><span class="arrow">${details.length?'▸':'·'}</span><span></span></div><div class="details"></div>`;box.querySelector('.logsummary span:last-child').textContent=summary;if(details.length){box.querySelector('.details').innerHTML=details.map(x=>`<div>${x}</div>`).join('');box.querySelector('.logsummary').onclick=()=>{box.classList.toggle('open');box.querySelector('.arrow').textContent=box.classList.contains('open')?'▾':'▸'}}log.prepend(box)}
function flash(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),900)}
function damageRoll(u){let rolls=[];for(let i=0;i<u.dmg[0];i++)rolls.push(die(u.dmg[1]));return {rolls,total:rolls.reduce((a,b)=>a+b,0)}}
function hitChance(a,t){let def=a.type==='magic'?t.mr:t.ac,need=Math.ceil(def-a.atk);need=Math.max(2,Math.min(20,need));return Math.max(5,Math.min(95,(21-need)*5))}
function resolveAttack(a,t){if(a.ap<a.cost||dist(a,t)>a.range)return;a.ap-=a.cost;let r=die(20),def=a.type==='magic'?t.mr:t.ac,total=r+a.atk,hit=r===20||(r!==1&&total>=def),details=[`d20 ${r} + attack ${a.atk} = ${total}`,`${a.type==='magic'?'MR':'AC'} target: ${def}`];if(hit){let dr=damageRoll(a),d=dr.total;if(r===20)d*=2;t.hp=Math.max(0,t.hp-d);details.push(`Damage dice: ${dr.rolls.join(' + ')}${r===20?' × 2 critical':''} = ${d}`,`${t.name} HP: ${t.hp}/${t.max}`);addLog(`${a.name} ${r===20?'CRITS':'hits'} ${t.name} for ${d} damage.`,details);flash(`${r===20?'CRIT':'HIT'} · ${d} damage`);if(!t.hp)addLog(`${t.name} is defeated.`)}else{addLog(`${a.name} misses ${t.name}.`,details);flash('MISS')}mode=null;pendingTarget=null;render();checkEnd()}
function checkEnd(){if(!alive('enemy').length){gameOver=true;status.textContent='Victory — enemy squad defeated';render();return true}if(!alive('hero').length){gameOver=true;status.textContent='Defeat — the party has fallen';render();return true}return false}
function rollInitiative(){order=units.filter(u=>u.hp>0);let details=[];order.forEach(u=>{u.initDie=die(10);u.init=u.initDie+u.int;u.ap=3});order.sort((a,b)=>b.init-a.init);order.forEach((u,i)=>details.push(`${i+1}. ${u.name}: d10 ${u.initDie} + INT ${u.int} = ${u.init}`));turn=0;addLog(`Round ${round} — Initiative ${round===1?'rolled':'re-rolled'}`,details);render();advanceAI()}
function next(){if(gameOver)return;mode=null;pendingTarget=null;hoverPath=[];turn++;while(turn<order.length&&order[turn].hp<=0)turn++;if(turn>=order.length){round++;rollInitiative();return}render();advanceAI()}
function occupied(x,y,except){return units.some(u=>u.hp>0&&u!==except&&u.x===x&&u.y===y)}
function pathTo(a,tx,ty,max=4){if(occupied(tx,ty,a))return null;let q=[[a.x,a.y]],seen=new Map([[`${a.x},${a.y}`,null]]),end=null;while(q.length){let [x,y]=q.shift();if(x===tx&&y===ty){end=[x,y];break}let prev=seen.get(`${x},${y}`),depth=0,k=`${x},${y}`;while(seen.get(k)){depth++;let p=seen.get(k);k=`${p[0]},${p[1]}`}if(depth>=max)continue;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;let nx=x+dx,ny=y+dy,key=`${nx},${ny}`;if(nx<0||nx>=15||ny<0||ny>=15||seen.has(key)||occupied(nx,ny,a))continue;seen.set(key,[x,y]);q.push([nx,ny])}}if(!end)return null;let p=[],k=end;while(k&&!(k[0]===a.x&&k[1]===a.y)){p.push(k);k=seen.get(`${k[0]},${k[1]}`)}return p.reverse()}
function stepToward(a,t){let dx=Math.sign(t.x-a.x),dy=Math.sign(t.y-a.y),nx=a.x+dx,ny=a.y+dy;if(nx>=0&&nx<15&&ny>=0&&ny<15&&!occupied(nx,ny,a)){a.x=nx;a.y=ny}}
function enemyTurn(){let a=cur();if(!a||a.team!=='enemy'||a.hp<=0){next();return}let safety=8;while(a.ap>0&&safety--&&!gameOver){let t=alive('hero').sort((p,q)=>dist(a,p)-dist(a,q))[0];if(!t)break;if(dist(a,t)<=a.range&&a.ap>=a.cost){resolveAttack(a,t);if(gameOver)return}else if(a.ap>=1){let from=coord(a.x,a.y);for(let i=0;i<4;i++)stepToward(a,t);a.ap--;addLog(`${a.name} moves ${from} → ${coord(a.x,a.y)}.`)}else break}setTimeout(next,250)}
function advanceAI(){let a=cur();if(a&&a.team==='enemy'&&!gameOver){status.textContent=`Round ${round} · ${a.name} acting`;setTimeout(enemyTurn,300)}}
function chooseAttack(t){let a=cur();pendingTarget=t;modaltext.innerHTML=`<b>${a.name} → ${t.name}</b><br>Target: ${coord(t.x,t.y)}<br>Hit chance: <b>${hitChance(a,t)}%</b><br>Cost: <b>${a.cost} AP</b><br>Defense: ${a.type==='magic'?'MR':'AC'} ${a.type==='magic'?t.mr:t.ac}`;modal.classList.add('show')}
function cellClick(x,y,u){let a=cur();if(gameOver||!a||a.team!=='hero')return;if(mode==='move'){let p=pathTo(a,x,y,4);if(!u&&a.ap>=1&&p&&p.length<=4){let from=coord(a.x,a.y);a.x=x;a.y=y;a.ap--;addLog(`${a.name} moves ${from} → ${coord(x,y)}.`,[`Path: ${[from,...p.map(z=>coord(z[0],z[1]))].join(' → ')}`,`Cost: 1 AP · Remaining AP: ${a.ap}/3`]);flash(`MOVE · ${p.length} tile${p.length===1?'':'s'} · ${a.ap} AP left`);mode=null;hoverPath=[];render()}else hint.textContent='That destination is not reachable for 1 AP.'}else if(mode==='attack'){if(u&&u.team==='enemy'&&u.hp>0&&dist(a,u)<=a.range&&a.ap>=a.cost)chooseAttack(u);else hint.textContent='Select one of the highlighted enemies in range.'}}
function render(){grid.innerHTML='';let corner=document.createElement('div');corner.className='axis';grid.appendChild(corner);for(let x=0;x<15;x++){let d=document.createElement('div');d.className='axis';d.textContent=String.fromCharCode(65+x);grid.appendChild(d)}for(let y=0;y<15;y++){let r=document.createElement('div');r.className='axis';r.textContent=y+1;grid.appendChild(r);for(let x=0;x<15;x++){let c=document.createElement('button');c.className='cell';c.type='button';c.dataset.x=x;c.dataset.y=y;let u=units.find(q=>q.hp>0&&q.x===x&&q.y===y),a=cur();if(u){c.textContent=u.label||u.id;c.classList.add(u.team);c.title=`${coord(x,y)} · ${u.name} · ${u.hp}/${u.max} HP`;if(a===u)c.classList.add('selected')}else c.title=coord(x,y);if(a?.team==='hero'&&mode==='move'){let p=pathTo(a,x,y,4);if(p&&p.length<=4)c.classList.add('legal');if(hoverPath.some(z=>z[0]===x&&z[1]===y))c.classList.add('path')}if(a?.team==='hero'&&mode==='attack'&&u?.team==='enemy'){if(dist(a,u)<=a.range&&a.ap>=a.cost)c.classList.add('target');else c.classList.add('invalid')}c.onclick=()=>cellClick(x,y,u);c.onmouseenter=()=>{if(mode==='move'&&a?.team==='hero'&&!u){hoverPath=pathTo(a,x,y,4)||[];hint.textContent=hoverPath.length?`${coord(x,y)} · ${hoverPath.length} tile${hoverPath.length===1?'':'s'} · 1 AP · click to move`:'Destination not reachable for 1 AP';render()}else if(mode==='attack'&&u?.team==='enemy'&&dist(a,u)<=a.range)hint.textContent=`${u.name} at ${coord(x,y)} · ${hitChance(a,u)}% hit · ${a.cost} AP · click to preview`};grid.appendChild(c)}}
let a=cur();if(a&&!gameOver){status.textContent=`Round ${round} · ${a.name}'s turn`;unitBox.innerHTML=`<b>${a.name}</b><br>HP ${a.hp}/${a.max} · <b>AP ${a.ap}/3</b><br>AC ${a.ac} · MR ${a.mr}<br>Attack +${a.atk} · ${a.type}<br>Weapon action: ${a.cost} AP`;hint.textContent=a.team==='hero'?(mode==='move'?'MOVE MODE — hover a highlighted tile to preview the path, then click to commit.':mode==='attack'?'ATTACK MODE — select a highlighted enemy to preview the attack.':'Choose Move, Attack, or End Turn.'):'Enemy AI is acting.'}
initBox.innerHTML='';order.forEach((u,i)=>{let d=document.createElement('div');d.className='turn'+(i===turn?' current':'');d.textContent=`${i===turn?'▶ ':''}${u.name} · ${u.init}${u.hp<=0?' · defeated':''}`;initBox.appendChild(d)});let heroTurn=a&&a.team==='hero'&&!gameOver;move.disabled=!heroTurn||a.ap<1;attack.disabled=!heroTurn||a.ap<a.cost;end.disabled=!heroTurn;cancel.disabled=!heroTurn||!mode}
move.onclick=()=>{if(cur()?.team==='hero'){mode='move';pendingTarget=null;render()}};attack.onclick=()=>{if(cur()?.team==='hero'){mode='attack';pendingTarget=null;render()}};cancel.onclick=()=>{mode=null;pendingTarget=null;hoverPath=[];render()};end.onclick=()=>{if(cur()?.team==='hero')next()};restart.onclick=start;modalcancel.onclick=()=>{modal.classList.remove('show');pendingTarget=null;render()};modalconfirm.onclick=()=>{let a=cur(),t=pendingTarget;modal.classList.remove('show');if(a&&t)resolveAttack(a,t)};
function start(){units=base.map(u=>({...u,ap:3}));order=[];turn=0;round=1;mode=null;gameOver=false;hoverPath=[];pendingTarget=null;log.innerHTML='';rollInitiative()}start();
})();</script></body></html>
